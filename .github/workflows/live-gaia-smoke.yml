name: Live Gaia endpoint smoke (external service)
on:
  push:
    paths:
      - '.github/workflows/live-gaia-smoke.yml'
      - 'backend/astronomy/gaia_client.py'
      - 'backend/main.py'
  workflow_dispatch:

jobs:
  check-public-gaia:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live Render health and actual ESA Gaia response
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          base = 'https://spheralyx-ai.onrender.com'
          def fetch(path, timeout=95):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'SPHERALYX-CI-Science-Smoke/1'}),timeout=timeout) as r:
                  return r.status,json.load(r)
          status,health=fetch('/health',25)
          print('Health HTTP:',status,'mode:',health.get('data_mode'),'catalog:',health.get('catalog_mode'))
          assert status==200 and health.get('catalog_mode')=='real', 'Catálogos no disponibles en Render'
          path='/api/gaia/sources?ra=83.8221&dec=-5.3911&radius=0.02&limit=10'
          try:
              status,data=fetch(path,110)
          except urllib.error.HTTPError as e:
              print('Gaia HTTP error:',e.code,e.read(800).decode('utf-8','replace'))
              raise
          sources=data.get('sources',[])
          print('Gaia HTTP:',status,'mode:',data.get('mode'),'count:',data.get('count'),'truncated:',data.get('truncated'),'source:',data.get('source'))
          assert status==200 and data.get('mode')=='real', 'Gaia no devolvió respuesta real'
          assert len(sources)>0, 'Gaia devolvió cero registros para campo de prueba'
          first=sources[0]
          assert isinstance(first.get('source_id'),str), 'source_id no es cadena'
          assert isinstance(first.get('ra'),(int,float)) and isinstance(first.get('dec'),(int,float)), 'Coordenadas incompletas'
          assert 'l' in first and 'b' in first, 'Faltan columnas galácticas'
          print('PASS: al menos una fuente Gaia real con RA/Dec, ID y columnas galácticas')
          wise='/api/wise/sources?ra=83.8221&dec=-5.3911&radius=0.02&limit=10'
          try:
              status,w=fetch(wise,95)
              print('AllWISE HTTP:',status,'mode:',w.get('mode'),'count:',w.get('count'),'source:',w.get('source'))
              assert status==200 and w.get('mode')=='real', 'AllWISE no devolvió respuesta real'
              assert isinstance(w.get('sources'),list), 'AllWISE no devolvió lista'
              if w['sources']:
                  assert isinstance(w['sources'][0].get('source_id'),str), 'WISE source_id inválido'
              print('PASS: consulta AllWISE real procesada sin inventar fuentes')
          except urllib.error.HTTPError as e:
              print('AllWISE HTTP error:',e.code,e.read(500).decode('utf-8','replace'))
              raise
          PY
