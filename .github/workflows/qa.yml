name: SPHERALYX scientific and frontend QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SPHERALYX_OFFLINE: "0"
      SPHERALYX_CATALOGS_ONLINE: "0"
      SPHERALYX_INTERNAL_EXPERIMENTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install scientific dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run local backend tests without live external requests
        run: python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chromium
        id: browser
        run: |
          command -v chromium || command -v chromium-browser || command -v google-chrome
      - name: Browser integration audit with mocked scientific services
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_PATH" ]; then
            CHROME_PATH="$(command -v chromium || command -v chromium-browser)"
            export CHROME_PATH
          fi
          node frontend/tests/audit.mjs
