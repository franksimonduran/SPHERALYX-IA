name: Diagnose Gaia AIP mirror transport
on:
  push:
    paths:
      - '.github/workflows/gaia-transport-diagnostic.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test one bounded Gaia DR3 AIP mirror query
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,urllib.error
          q="SELECT TOP 2 source_id,ra,dec,l,b,ref_epoch,phot_g_mean_mag,bp_rp FROM gaiadr3.gaia_source WHERE 1=CONTAINS(POINT('ICRS',ra,dec),CIRCLE('ICRS',83.8221,-5.3911,0.02))"
          url='https://gaia.aip.de/tap/sync?'+urllib.parse.urlencode({'REQUEST':'doQuery','LANG':'ADQL','RESPONSEFORMAT':'text/csv','QUERY':q})
          req=urllib.request.Request(url,headers={'User-Agent':'SPHERALYX-ScienceCheck/1','Accept':'*/*'})
          try:
            with urllib.request.urlopen(req,timeout=50) as r:
              body=r.read(1400)
              print('AIP HTTP:',r.status,'final:',r.url,'type:',r.headers.get('content-type'),'sample:',repr(body[:1200]))
          except urllib.error.HTTPError as e:
            print('AIP HTTP ERROR:',e.code,'type:',e.headers.get('content-type'),'sample:',repr(e.read(1100)))
          except Exception as e:
            print('AIP EXCEPTION:',type(e).__name__,str(e)[:350])
          PY
